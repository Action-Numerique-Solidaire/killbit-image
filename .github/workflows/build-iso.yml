name: Build ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      killbit_url:
        description: "URL du binaire killbit à embarquer"
        required: false
        default: "https://github.com/r3dge/ANS-public/raw/refs/heads/main/bin/killbit"
      killbit_sha256:
        description: "Empreinte SHA-256 attendue (vide = pas de vérification)"
        required: false
        default: ""

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Analyse statique des scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck build-iso.sh overlay/usr/local/sbin/killbit-launcher.sh

  build:
    # ubuntu-24.04 impératif : killbit exige GLIBC_2.38, l'image est basée sur noble.
    runs-on: ubuntu-24.04
    needs: shellcheck
    permissions:
      contents: write   # nécessaire uniquement pour publier la release sur tag
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        # Une ISO live + son chroot + le squashfs dépassent facilement ce que
        # laisse l'image préinstallée du runner.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Installer les dépendances de construction
        # grub-efi-amd64-bin, mtools et dosfstools ne sont PAS installés ici :
        # le chargeur UEFI est construit dans le chroot, l'hôte n'a besoin que
        # de xorriso.
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso isolinux syslinux-common

      - name: Construire l'ISO
        env:
          KILLBIT_ISO_WORK: ${{ runner.temp }}/killbit-build
          KILLBIT_URL: ${{ github.event.inputs.killbit_url || 'https://github.com/r3dge/ANS-public/raw/refs/heads/main/bin/killbit' }}
          KILLBIT_SHA256: ${{ github.event.inputs.killbit_sha256 || '' }}
        run: |
          sudo -E ./build-iso.sh "$GITHUB_WORKSPACE/killbit-live.iso"
          sudo chown "$USER" "$GITHUB_WORKSPACE/killbit-live.iso"*

      - name: Vérifier que l'ISO est amorçable en BIOS ET en UEFI
        # Le chantier PXE a livré une ISO BIOS seul sans que personne ne le voie :
        # cette assertion rend l'erreur impossible à rater.
        run: |
          report=$(xorriso -indev killbit-live.iso -report_el_torito plain 2>/dev/null)
          echo "$report"
          echo "$report" | grep -q 'El Torito boot img :   1  BIOS' \
            || { echo "::error::Entrée El Torito BIOS absente"; exit 1; }
          echo "$report" | grep -q 'UEFI' \
            || { echo "::error::Entrée El Torito UEFI absente — l'ISO ne démarrerait pas sur du matériel récent"; exit 1; }

      - name: Récapitulatif
        run: |
          {
            echo "### ISO killbit"
            echo
            echo '```'
            ls -lh killbit-live.iso
            cat killbit-live.iso.sha256
            echo '```'
            echo
            echo "Écriture sur clé USB :"
            echo '```bash'
            echo 'sudo dd if=killbit-live.iso of=/dev/sdX bs=4M status=progress conv=fsync'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: killbit-live-iso
          path: |
            killbit-live.iso
            killbit-live.iso.sha256
          retention-days: 14
          compression-level: 0   # une ISO xz est déjà compressée

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ISO live hybride BIOS + UEFI embarquant killbit.

          Ecriture sur cle USB :

          ```bash
          sudo dd if=killbit-live.iso of=/dev/sdX bs=4M status=progress conv=fsync
          ```

          Secure Boot doit etre desactive dans le firmware : le chargeur n'est pas signe.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            killbit-live.iso killbit-live.iso.sha256 \
            --title "killbit-image $GITHUB_REF_NAME" \
            --notes-file notes.md
