name: Build ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      killbit_url:
        description: "URL du binaire killbit à embarquer"
        required: false
        default: "https://github.com/r3dge/ANS-public/raw/refs/heads/main/bin/killbit"
      killbit_sha256:
        description: "Empreinte SHA-256 attendue (vide = pas de vérification)"
        required: false
        default: ""
      with_browser:
        description: "Réembarquer X + firefox, sans gestionnaire de fenêtres (1) ou image console seule (0)"
        required: false
        default: "0"
      report_url:
        description: "Point de remontée des rapports, pré-rempli dans l'historique du shell"
        required: false
        default: "https://actionnumeriquesolidaire.org"

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # shellcheck est préinstallé sur l'image des runners : l'installer coûtait
      # un apt-get update pour rien.
      - run: |
          shellcheck --version
          shellcheck build-iso.sh overlay/usr/local/sbin/killbit-session.sh tests/boot-test.sh

  build:
    runs-on: ubuntu-24.04
    needs: shellcheck
    permissions:
      contents: write   # publication de la release
    steps:
      - uses: actions/checkout@v4

      - name: Choisir le disque de travail
        id: work
        # Le disque temporaire /mnt des runners est bien plus grand que la
        # racine. L'utiliser remplace l'étape qui supprimait dotnet, android et
        # ghc pour faire de la place : elle coûtait 90 s, soit 18 % du job.
        run: |
          set -Eeuo pipefail
          df -h / /mnt || true
          # /mnt appartient a root sur les runners : c'est sudo qui y ecrit,
          # pas l'utilisateur du runner. Tester -w en tant qu'utilisateur
          # renverrait toujours faux et l'optimisation ne s'appliquerait jamais.
          dir="$RUNNER_TEMP/killbit-build"
          if sudo mkdir -p /mnt/killbit-build 2>/dev/null; then
            avail=$(df --output=avail -k /mnt | tail -1 | tr -d ' ')
            if [ "${avail:-0}" -ge 6000000 ]; then dir=/mnt/killbit-build; fi
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Répertoire de travail : $dir"

      - name: Installer les dépendances de construction
        # debian-archive-keyring est indispensable : le runner est sous Ubuntu
        # et debootstrap refuserait l'archive Debian sans son trousseau.
        # grub-efi, mtools et dosfstools ne sont PAS installés ici, le chargeur
        # UEFI étant construit dans le chroot. isolinux non plus : ses artefacts
        # sont extraits du chroot.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring squashfs-tools xorriso \
            qemu-system-x86 ovmf

      - name: Construire l'ISO
        env:
          KILLBIT_ISO_WORK: ${{ steps.work.outputs.dir }}
          KILLBIT_URL: ${{ inputs.killbit_url || 'https://github.com/r3dge/ANS-public/raw/refs/heads/main/bin/killbit' }}
          KILLBIT_SHA256: ${{ inputs.killbit_sha256 || '' }}
          KILLBIT_WITH_BROWSER: ${{ inputs.with_browser || '0' }}
          KILLBIT_REPORT_URL: ${{ inputs.report_url || 'https://actionnumeriquesolidaire.org' }}
        run: |
          sudo -E ./build-iso.sh "$GITHUB_WORKSPACE/killbit-live.iso"
          sudo chown "$USER" "$GITHUB_WORKSPACE/killbit-live.iso"*
          ls -lh killbit-live.iso

      - name: Vérifier que l'ISO est amorçable en BIOS ET en UEFI
        # Une ISO BIOS seul ne démarre pas sur du matériel post-2012 à CSM
        # désactivé, et le défaut est invisible à l'œil nu.
        run: |
          report=$(xorriso -indev killbit-live.iso -report_el_torito plain 2>/dev/null)
          echo "$report"
          echo "$report" | grep -q 'BIOS' \
            || { echo "::error::Entrée El Torito BIOS absente"; exit 1; }
          echo "$report" | grep -q 'UEFI' \
            || { echo "::error::Entrée El Torito UEFI absente"; exit 1; }

      - name: Vérifier le contenu de l'image
        # Deux promesses à tenir, et chacune a son garde-fou :
        #   1. ce qui doit y être : killbit, ses outils, l'accueil opérateur et
        #      l'historique pré-rempli ;
        #   2. ce qui ne doit PLUS y être. Sans ce second contrôle, la
        #      minimisation se déferait au premier ajout de paquet distrait.
        run: |
          sudo mkdir -p /mnt/iso /mnt/sq
          sudo mount -o loop,ro killbit-live.iso /mnt/iso
          sudo mount -o loop,ro /mnt/iso/live/filesystem.squashfs /mnt/sq
          fail=0

          echo "--- doit etre present ---"
          for f in usr/local/bin/killbit usr/sbin/hdparm usr/sbin/nvme \
                   usr/sbin/smartctl usr/local/sbin/killbit-session.sh \
                   root/.bash_profile root/.bashrc root/.bash_history \
                   etc/killbit-image-release etc/default/keyboard; do
            if sudo test -e "/mnt/sq/$f"; then echo "  OK       $f"
            else echo "::error::absent de l'image : $f"; fail=1; fi
          done

          echo "--- bibliotheques exigees par killbit ---"
          for l in libcurl.so.4 libsodium.so.23 libstdc++.so.6; do
            if sudo find /mnt/sq/usr/lib -name "$l*" -print -quit | grep -q .; then
              echo "  OK       $l"
            else echo "::error::bibliotheque absente : $l"; fail=1; fi
          done

          echo "--- la commande doit etre prete dans l_historique ---"
          if sudo grep -q 'killbit -i <id_du_poste> -u http' /mnt/sq/root/.bash_history; then
            echo "  OK       commande d_effacement en derniere ligne d_historique"
            sudo cat /mnt/sq/root/.bash_history | sed 's/^/           /'
          else
            echo "::error::la commande killbit -i ... -u ... n_est pas dans l_historique"; fail=1
          fi

          echo "--- ne doit PLUS etre present (verrou de minimisation) ---"
          for f in usr/bin/openbox usr/bin/Xorg usr/bin/xterm usr/bin/firefox-esr \
                   usr/sbin/mkfs.vfat usr/bin/mcopy usr/lib/ISOLINUX/isolinux.bin; do
            if sudo test -e "/mnt/sq/$f"; then
              echo "::error::present alors qu_il devrait etre absent : $f"; fail=1
            else echo "  ABSENT   $f"; fi
          done
          if sudo find /mnt/sq/usr/lib/firmware -maxdepth 1 -name 'iwlwifi*' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::micrologiciels Wi-Fi iwlwifi presents (111 Mo inutilisables sans wpasupplicant)"; fail=1
          else echo "  ABSENT   usr/lib/firmware/iwlwifi*"; fi

          echo "--- taille du systeme de fichiers embarque ---"
          sudo du -sh /mnt/sq | sed 's/^/  /'
          sudo cat /mnt/sq/etc/killbit-image-release | sed 's/^/  /'
          sudo umount /mnt/sq /mnt/iso
          exit $fail

      - name: Tests d'amorçage réels (BIOS et UEFI en parallèle)
        # Une ISO peut contenir tous les bons fichiers et paniquer au démarrage :
        # c'est arrivé, faute de systemd-sysv donc de /sbin/init. Seul un
        # démarrage réel le prouve. Pas de KVM sur un runner, donc émulation —
        # d'où les deux amorçages menés en parallèle plutôt qu'à la suite.
        timeout-minutes: 25
        run: |
          set -Eeuo pipefail
          ./tests/boot-test.sh killbit-live.iso bios 900 > bios.log 2>&1 & pb=$!
          ./tests/boot-test.sh killbit-live.iso uefi 900 > uefi.log 2>&1 & pu=$!
          rc=0
          wait "$pb" || rc=1
          wait "$pu" || rc=1
          echo "::group::console BIOS"; cat bios.log; echo "::endgroup::"
          echo "::group::console UEFI"; cat uefi.log; echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then echo "::error::un amorçage a échoué"; fi
          exit $rc

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### ISO killbit"
            echo '```'
            ls -lh killbit-live.iso 2>/dev/null || echo "(pas d'ISO)"
            cat killbit-live.iso.sha256 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: killbit-live-iso
          path: |
            killbit-live.iso
            killbit-live.iso.sha256
          retention-days: 14
          compression-level: 0   # le squashfs est déjà compressé

      # --- Publication en release ------------------------------------------
      - name: Publier la release glissante (push sur main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Construction automatique depuis \`main\` (${GITHUB_SHA:0:7})."
            echo
            echo "ISO live hybride BIOS + UEFI, base Debian 13, embarquant killbit."
            echo "Image **console seule** : ni serveur X ni gestionnaire de fenêtres."
            echo
            echo '```bash'
            echo 'sudo dd if=killbit-live.iso of=/dev/sdX bs=4M status=progress conv=fsync'
            echo '```'
            echo
            echo "Secure Boot doit etre desactive : le chargeur n'est pas signe."
            echo
            echo '```'
            cat killbit-live.iso.sha256
            echo '```'
          } > notes.md
          # Release glissante : on remplace l'ISO precedente plutot que
          # d'accumuler une release par commit.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest killbit-live.iso killbit-live.iso.sha256 \
            --title "Derniere construction (main)" \
            --notes-file notes.md \
            --prerelease

      - name: Publier la release versionnée (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "ISO live hybride BIOS + UEFI, base Debian 13, embarquant killbit."
            echo "Image **console seule** : ni serveur X ni gestionnaire de fenêtres."
            echo
            echo '```bash'
            echo 'sudo dd if=killbit-live.iso of=/dev/sdX bs=4M status=progress conv=fsync'
            echo '```'
            echo
            echo "Secure Boot doit etre desactive : le chargeur n'est pas signe."
            echo
            echo '```'
            cat killbit-live.iso.sha256
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            killbit-live.iso killbit-live.iso.sha256 \
            --title "killbit-image $GITHUB_REF_NAME" \
            --notes-file notes.md
