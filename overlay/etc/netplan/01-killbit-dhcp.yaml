# live-config ne configure pas le réseau et /etc/netplan est vide dans un chroot
# debootstrap : sans ce fichier, l'image démarre sans adresse IP et killbit ne
# peut pas remonter ses rapports. optional:true évite d'attendre au démarrage sur
# une machine non branchée (l'effacement local reste possible hors ligne).
network:
  version: 2
  renderer: networkd
  ethernets:
    all-en:
      match:
        name: "en*"
      dhcp4: true
      optional: true
    all-eth:
      match:
        name: "eth*"
      dhcp4: true
      optional: true
